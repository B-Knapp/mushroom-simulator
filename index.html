<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mushroom Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 16a12 9 0 0 1 24 0z' fill='%23b8763a'/%3E%3Crect x='13' y='16' width='6' height='12' rx='2' fill='%23efe6d4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="view"></canvas>

  <header id="bar">
    <div class="group">
      <span class="title">Mushroom Simulator</span>
      <span id="clock" class="clock">Day 1 · 06:00</span>
    </div>
    <div class="group" id="speeds">
      <button data-speed="0" title="Pause (Space)">Pause</button>
      <button data-speed="1" title="1× (1)">1×</button>
      <button data-speed="10" title="10× (2)">10×</button>
      <button data-speed="100" title="100× (3)">100×</button>
    </div>
    <div class="group">
      <button id="fit" title="Fit world to screen (F)">Fit</button>
      <span class="seed">Seed <span id="seed"></span></span>
      <button id="newWorld" title="Start a new world with a random seed">New world</button>
    </div>
  </header>

  <pre id="debug"></pre>

  <script type="module" src="src/main.js"></script>
</body>
</html>
